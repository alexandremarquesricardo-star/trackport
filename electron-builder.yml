appId: com.trackport.app
productName: TrackPort
copyright: Copyright (c) 2026 TrackPort

directories:
  output: release
  buildResources: build

files:
  - "out/**/*"
  - "package.json"

extraResources:
  - from: build/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.music
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Audio
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
  releaseType: draft
