name: Release

# Triggered by pushing a v-prefixed tag, e.g. `git tag v0.2.0 && git push --tags`.
# The Windows build step uploads its installer to a draft GitHub Release;
# electron-builder's GH provider creates the draft on first artifact and
# appends to it on subsequent platform jobs. Promote the draft to a real
# release manually after smoke-testing the binaries.
on:
  push:
    tags:
      - "v*"

permissions:
  # We're going to upload artifacts to a Release, which needs write access.
  contents: write

# Cancel an in-flight release if a newer tag is pushed against the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pin Python so node-gyp keeps working. Python 3.12 dropped `distutils`
      # from the stdlib, and the node-gyp bundled inside app-builder-lib
      # still imports it during drivelist's native rebuild. windows-latest
      # ships 3.12+ by default, so without this the postinstall step blows
      # up before any build work happens.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint + format-check + tests
        # Same gate as CI; we don't ship a binary that wouldn't pass the
        # main-branch checks. Cheaper to fail here than after a 4-minute
        # NSIS build.
        run: |
          npm run lint
          npm run format:check
          npm test
          npm run typecheck

      - name: Bundle app (electron-vite)
        # Produces out/main/index.js + out/preload/* + out/renderer/* —
        # the files electron-builder packages into app.asar. Without this,
        # electron-builder fails the sanity check after building the
        # unpacked tree. Typecheck already ran in the previous step, so
        # we call electron-vite directly instead of `npm run build`
        # (which would re-typecheck).
        run: npx electron-vite build

      - name: Build + publish Windows installer
        # `electron-builder --publish always` builds the NSIS installer,
        # generates the latest.yml + .blockmap auto-update sidecars, and
        # uploads everything to a draft GitHub Release for this tag.
        # GH_TOKEN is the standard secret — the default GITHUB_TOKEN has
        # the `contents: write` permission granted above.
        run: npx electron-builder --win --publish always
        env:
          # Code signing is opt-in. Set these in the repo's Actions
          # secrets to enable Authenticode signing of the installer:
          #   WIN_CSC_LINK            — base64 of your .pfx OR a URL
          #   WIN_CSC_KEY_PASSWORD    — the PFX password
          # Leave both unset for unsigned builds (will trigger SmartScreen
          # warnings on first install — fine for early testing).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS DMG
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same reason as the Windows job — see comment there. macos-latest also
      # ships Python 3.12+ by default; the bundled node-gyp inside
      # app-builder-lib still does `from distutils.version import StrictVersion`.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint + format-check + tests
        run: |
          npm run lint
          npm run format:check
          npm test
          npm run typecheck

      - name: Bundle app (electron-vite)
        # See the matching step in the Windows job. Produces the out/
        # tree electron-builder packages into the .app bundle.
        run: npx electron-vite build

      - name: Build + publish macOS DMG
        # Universal arm64 + x64 DMG per electron-builder.yml, plus the
        # auto-update sidecars (latest-mac.yml + .blockmap). Hardened
        # runtime is already on in electron-builder.yml; notarization
        # auto-engages when the APPLE_* env vars are set, otherwise the
        # DMG ships unsigned (Gatekeeper warning at first open).
        run: npx electron-builder --mac --publish always
        env:
          # Apple Developer ID code signing — opt-in via secrets:
          #   CSC_LINK            — base64 of your .p12 OR a URL
          #   CSC_KEY_PASSWORD    — the P12 password
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Notarization — engaged when all three are present. Without
          # these, the build skips notarization but still completes
          # (signed-but-not-notarized binaries trigger Gatekeeper on
          # first open, just like fully unsigned builds).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
